# Single-host n8n stack for EC2. Postgres for workflow storage, Caddy for TLS.
#
# Deploy:  docker compose up -d
#
# n8n is deliberately NOT port-published. Caddy is the only way in, which is
# what makes the security group rule (80/443 only) sufficient.
#
# Sized for a 2 GB box (t4g.small / t3.small). The memory limits below add up
# to ~1.6 GB, leaving headroom for the host. Raise them together if you move
# to a larger instance -- raising one alone just lets it starve the others.

services:
  postgres:
    # n8n treats Postgres 16 as compatibility-only and asks for 17+.
    image: postgres:17-alpine
    restart: unless-stopped
    # Defaults assume a machine much larger than this one. 50 connections is
    # far more than n8n opens, and 128 MB of shared buffers fits the limit.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # A Postgres data directory is version-specific: 17 cannot read a 16
      # directory. Upgrading means a new volume plus a dump/restore, never a
      # tag bump on its own.
      - pg_data_17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    # Docker's default json-file driver has no size cap. On a 20 GB disk an
    # unrotated log is what eventually fills it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    # Pinned on purpose -- see N8N_VERSION in .env. `latest` means a routine
    # `docker compose pull` can drop a breaking major on you with no warning.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Set N8N_VERSION in .env}
    restart: unless-stopped
    environment:
      # --- identity / URLs -------------------------------------------------
      # WEBHOOK_URL is what n8n prints as the production webhook address.
      # Without it every generated URL says localhost:5678 and nothing external
      # can call your workflows.
      N8N_HOST: ${DOMAIN:?Set DOMAIN in .env}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${DOMAIN}/

      # Number of proxies in front of n8n. Caddy alone is 1. Add one per extra
      # layer -- behind Cloudflare's orange cloud it is 2. Get this wrong and
      # n8n treats the proxy's IP as the client IP, so rate limiting and the
      # access logs both point at the wrong address.
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}

      # --- secrets ---------------------------------------------------------
      # Encrypts stored credentials. BACK THIS UP OFF THE BOX. Lose it and
      # every credential in the instance is unreadable, volume or no volume.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}

      # --- database --------------------------------------------------------
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- scheduling ------------------------------------------------------
      # Cron fires in n8n's timezone, not the host's. Set both.
      GENERIC_TIMEZONE: ${TZ:-Asia/Karachi}
      TZ: ${TZ:-Asia/Karachi}

      # --- execution retention ---------------------------------------------
      # Without pruning the executions table grows forever and eventually
      # becomes the largest thing on the disk.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"          # hours (14 days)
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "50000"

      # --- limits ----------------------------------------------------------
      # One hour ceiling per execution. A stuck HTTP node otherwise holds its
      # slot forever. Raise EXECUTIONS_TIMEOUT if you have legitimately long
      # jobs; EXECUTIONS_TIMEOUT_MAX is the hard cap a workflow may request.
      EXECUTIONS_TIMEOUT: "3600"
      EXECUTIONS_TIMEOUT_MAX: "7200"

      # 2 GB of RAM cannot absorb unbounded parallel executions. Queued work
      # waits instead of the container being OOM-killed mid-run.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "5"

      # Keep Node's heap under the container limit so it garbage-collects
      # instead of getting killed. Must stay below mem_limit below.
      NODE_OPTIONS: "--max-old-space-size=768"

      # --- node sandboxing --------------------------------------------------
      # Anyone who can log into the editor can run code. These two keep that
      # blast radius inside /files and out of the container's environment
      # (which holds N8N_ENCRYPTION_KEY and the database password).
      # Drop N8N_BLOCK_ENV_ACCESS_IN_NODE if a workflow genuinely needs $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files

      # --- misc ------------------------------------------------------------
      N8N_LOG_LEVEL: info
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      # Anything you want Execute Command / Read File nodes to reach lives here.
      - ./files:/files
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Requires inbound UDP 443 in the security group -- if you did
      # not open it, delete this line rather than leaving a port that only
      # ever times out.
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - n8n

volumes:
  # The pre-upgrade Postgres 16 directory. Kept as a rollback path -- delete
  # it with `docker volume rm n8n-deployment_pg_data` once 17 has proven
  # itself. Note that `docker compose down -v` would take it with everything
  # else, so do not rely on it as a backup.
  pg_data:
  pg_data_17:
  n8n_data:
  caddy_data:
  caddy_config:
